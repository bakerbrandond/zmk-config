# White-on-black nice!view widgets (used by the icons below when enabled)
CONFIG_NICE_VIEW_WIDGET_INVERTED=y
# Night mountain scene on the nice!view
CONFIG_NICE_VIEW_SNOW_SCENE_MOUNTAIN_NIGHT=y

# Battery and connection icons (CaskaydiaCove) over the top of the snow scene.
# Off because the Prospector dongle already shows both for each half. Set =y
# to show them on the halves too, e.g. if you build this without a dongle
# (then the half you make central keeps ZMK's own status screen instead of
# the snow scene, and the other half shows the scene with these icons).
CONFIG_NICE_VIEW_SNOW_STATUS=n

# Tell the Prospector dongle when this half is on USB power, so it shows a
# charging bolt instead of the battery percentage (which reads ~100% while
# charging). Remove if you build without the Prospector.
CONFIG_PROSPECTOR_PERIPHERAL_CHARGING_SERVICE=y
