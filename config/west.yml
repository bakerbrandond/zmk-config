manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: kbrd-space
      url-base: https://github.com/kbrd-space
    - name: carrefinho
      url-base: https://github.com/carrefinho
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    - name: zmk-anti-idle
      remote: kbrd-space
      revision: main
    - name: prospector-zmk-module
      remote: carrefinho
      revision: main # main supports ZMK v0.3 and older (Zephyr 3.5)
  self:
    path: config
