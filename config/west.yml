manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: kbrd-space
      url-base: https://github.com/kbrd-space
    - name: bakerbrandond
      url-base: https://github.com/bakerbrandond
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    - name: zmk-anti-idle
      remote: kbrd-space
      revision: main
    - name: prospector-zmk-module
      remote: bakerbrandond
      revision: zappy # fork of carrefinho/prospector-zmk-module main (ZMK v0.3): Nord theme + battery bar fix + Zappy Birds game
  self:
    path: config
