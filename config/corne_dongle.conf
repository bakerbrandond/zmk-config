# Prospector display options (https://github.com/carrefinho/prospector-zmk-module)
# No APDS9960 ambient light sensor is fitted (polling it logged I2C errors
# every 100 ms), so use a fixed backlight level (1-100)
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50
# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y
# CONFIG_PROSPECTOR_LAYER_ROLLER_ALL_CAPS=y

# Words per minute, shown in the Prospector WPM panel
CONFIG_ZMK_WPM=y

# Zappy Birds: hidden game on the Prospector (FUN layer key; exit with Q + P)
CONFIG_PROSPECTOR_ZAPPY_BIRDS=y

# Matrix rain screensaver after 2 minutes without a key press
CONFIG_PROSPECTOR_MATRIX_SCREENSAVER=y
# System work queue (key processing) peaked at 95% of 2 KB in a debug build;
# 3 KB plus stack protection keeps an overflow from silently corrupting memory
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_HW_STACK_PROTECTION=y
# ZMK's low-priority work queue sat at 88% of 768 bytes in every debug run
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=1024

# ZMK Studio over the dongle's USB (unlock with the Function-layer M key)
CONFIG_ZMK_STUDIO=y

# Clock above the layer name, sent by the computer (see README "Clock").
# Uncomment for 12-hour time (h:MM AM/PM) instead of 24-hour HH:MM
# CONFIG_PROSPECTOR_CLOCK_12H=y

# The dongle has no battery of its own. Without this it announced a battery
# level to every paired computer each time it woke from idle, which woke a
# sleeping Mac paired on another Bluetooth profile.
CONFIG_QUIET_DONGLE_BATTERY=y
